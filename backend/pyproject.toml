[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-intel"
version = "0.1.0"
description = "Incident Intelligence backend: ingestion, detection, investigation, and learning."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "confluent-kafka>=2.15",
    "redis>=8.0",
    "firebase-admin>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-tools>=7.4",
]

[project.scripts]
ii = "incident_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Migrations ship inside the package so the API can resolve the expected
# Alembic head at runtime (readiness check) without depending on the CWD.
incident_intel = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the test PostgreSQL database",
    "kafka: requires a Kafka broker (TEST_KAFKA_BOOTSTRAP_SERVERS)",
    "redis: requires a Redis server (TEST_REDIS_URL)",
    "firebase: requires the Firebase Auth emulator (TEST_FIREBASE_AUTH_EMULATOR_HOST)",
]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "PL", "PT"]
ignore = [
    "PLR0913", # explicit keyword-only service signatures are clearer than parameter objects here
    "PLR0917", # FastAPI endpoints declare each injected dependency as a parameter
    "PLR2004", # magic values in comparisons are fine for HTTP status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"src/incident_intel/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["incident_intel", "tests"]
# Revision files are generated per migration and have non-importable names.
exclude = ["src/incident_intel/migrations/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# firebase-admin ships no type information; our wrapper (auth/tokens.py) is its only caller.
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
