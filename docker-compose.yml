# Local development stack. Services are added slice by slice as they gain a real job.
name: incident-intel

# Settings shared by every container built from ./backend. API secrets are NOT here:
# only the api service receives API_KEY_PEPPER.
x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:
  postgres:
    # pgvector image so V1.5 similarity search needs no image change.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process is both broker and controller.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: other containers (kafka:9092). EXTERNAL: host tooling (localhost:9094).
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created deliberately by `ii kafka init`, never by a typo'd producer.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Keep the JVM small on a laptop (leaves RAM for the local LLM later).
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      # Published on localhost only; PLAINTEXT without auth is for local development.
      - "127.0.0.1:9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Cache and rate limiter only: no persistence, bounded memory. Losing its contents is
  # safe (every use has a fallback), so there is no data volume.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      # Published on localhost only; no password is for local development.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot jobs: apply migrations and create Kafka topics before the app starts.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  kafka-init:
    build: ./backend
    command: ["ii", "kafka", "init"]
    environment: *backend-env
    depends_on:
      kafka:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      <<: *backend-env
      API_KEY_PEPPER: ${API_KEY_PEPPER:?run make env}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-600}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      # Sign-in for human users. Empty project id: user endpoints answer 503.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_AUTH_EMULATOR_HOST: ${FIREBASE_AUTH_EMULATOR_HOST:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      # Started, not healthy: the API runs (degraded) without Redis.
      redis:
        condition: service_started

  # Kafka telemetry.metrics.v1 → PostgreSQL. Scale with `--scale storage-consumer=N`
  # (up to the topic's partition count).
  storage-consumer:
    build: ./backend
    command: ["ii", "consume", "storage"]
    environment: *backend-env
    restart: unless-stopped
    # The image's HTTP health check is for the API. A consumer's real health signal is
    # consumer lag, which arrives with Prometheus monitoring (hardening slice).
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  # "Metrics stored" events → anomalies. Reads the points from PostgreSQL, so it only ever
  # evaluates data that is already stored.
  detection-consumer:
    build: ./backend
    command: ["ii", "consume", "detection"]
    environment: *backend-env
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  # Runs queued AI investigations. The only container that receives the LLM API key.
  # Without a key it still runs, and investigations fail with a clear message.
  investigation-worker:
    build: ./backend
    command: ["ii", "work"]
    environment:
      <<: *backend-env
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional: local stand-in for Firebase Authentication (`make emulator`). Started only
  # with the "emulator" profile, so `make up` does not need this large image.
  firebase-emulator:
    build: ./infra/firebase-emulator
    profiles: ["emulator"]
    ports:
      - "127.0.0.1:9099:9099"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9099/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  kafkadata:
